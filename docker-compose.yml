version: "3.8"

services:

  # ===============================
  # Base de données MariaDB
  # ===============================
  owncloud-db:
    image: mariadb:10.6
    container_name: oc_db_23U2423
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - res30_23U2423_net

  # ===============================
  # Application OwnCloud
  # ===============================
  owncloud:
    image: owncloud:latest
    container_name: oc_app_23U2423
    restart: unless-stopped
    depends_on:
      - owncloud-db
    env_file:
      - .env
    environment:
      OWNCLOUD_DB_TYPE: ${DB_TYPE}
      OWNCLOUD_DB_HOST: owncloud-db
      OWNCLOUD_DB_NAME: ${DB_NAME}
      OWNCLOUD_DB_USERNAME: ${DB_USER}
      OWNCLOUD_DB_PASSWORD: ${DB_PASSWORD}
      OWNCLOUD_ADMIN_USERNAME: ${OWNCLOUD_ADMIN_USERNAME}
      OWNCLOUD_ADMIN_PASSWORD: ${OWNCLOUD_ADMIN_PASSWORD}
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${DOMAIN}
    volumes:
      - ./data/owncloud:/var/www/html
    networks:
      - res30_23U2423_net

  # ===============================
  # Collabora Online
  # ===============================
  collabora:
    image: collabora/code:latest
    container_name: collabora_23U2423
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - domain=${COLLABORA_DOMAIN}
      - username=${COLLABORA_USERNAME}
      - password=${COLLABORA_PASSWORD}
      - DONT_GEN_SSL_CERT=true
      - extra_params=--o:ssl.enable=false
    networks:
      - res30_23U2423_net

networks:
  res30_23U2423_net:
    driver: bridge